<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Progress · Math Quest</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  :root {
    --bg: #0f0e17;
    --card: #1a1927;
    --border: #2e2c45;
    --accent1: #ff6b6b;
    --accent2: #ffd166;
    --accent3: #06d6a0;
    --accent4: #c77dff;
    --text: #fffffe;
    --muted: #a7a5c3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 20px 60px;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.1) 0%, transparent 100%),
      radial-gradient(2px 2px at 80% 10%, rgba(199,125,255,0.15) 0%, transparent 100%),
      radial-gradient(2px 2px at 40% 80%, rgba(6,214,160,0.1) 0%, transparent 100%);
    pointer-events: none; z-index: 0;
  }
  .container { max-width: 820px; margin: 0 auto; position: relative; z-index: 1; }

  .top-bar { display: flex; align-items: center; gap: 16px; margin-bottom: 32px; }
  .back-btn {
    background: var(--card); border: 1px solid var(--border);
    color: var(--muted); font-family: 'Space Mono', monospace; font-size: 12px;
    padding: 8px 14px; border-radius: 10px; cursor: pointer; text-decoration: none;
    transition: border-color 0.2s, color 0.2s;
  }
  .back-btn:hover { border-color: var(--accent4); color: var(--accent4); }
  .page-title {
    font-size: clamp(24px, 5vw, 36px); font-weight: 900;
    background: linear-gradient(135deg, var(--accent4), var(--accent3));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }

  .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 24px; }
  @media (max-width: 520px) { .stats-grid { grid-template-columns: 1fr 1fr; } }
  .stat-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 20px 18px; position: relative; overflow: hidden;
  }
  .stat-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  }
  .stat-card.c1::before { background: linear-gradient(90deg, var(--accent4), var(--accent3)); }
  .stat-card.c2::before { background: linear-gradient(90deg, var(--accent2), var(--accent1)); }
  .stat-card.c3::before { background: linear-gradient(90deg, var(--accent3), var(--accent4)); }
  .stat-label { font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .stat-value { font-family: 'Space Mono', monospace; font-size: 32px; font-weight: 700; line-height: 1; }
  .stat-value.c1 { color: var(--accent4); }
  .stat-value.c2 { color: var(--accent2); }
  .stat-value.c3 { color: var(--accent3); }
  .stat-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

  .section-label {
    font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 2px;
    text-transform: uppercase; color: var(--muted); margin-bottom: 12px;
  }
  .filter-wrap { margin-bottom: 24px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 700;
    border: 1.5px solid var(--border); background: var(--card); color: var(--muted);
    cursor: pointer; transition: all 0.2s; font-family: 'Nunito', sans-serif;
  }
  .chip:hover { border-color: var(--accent4); color: var(--accent4); }
  .chip.active { border-color: var(--accent4); background: rgba(199,125,255,0.12); color: var(--accent4); }

  .chart-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 20px;
    padding: 28px; margin-bottom: 24px; position: relative; overflow: hidden;
  }
  .chart-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--accent4), var(--accent2), var(--accent3), var(--accent1));
  }
  .chart-title { font-size: 15px; font-weight: 700; margin-bottom: 20px; color: var(--text); }
  .chart-wrap { position: relative; height: 220px; }

  .topic-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
  @media (max-width: 520px) { .topic-grid { grid-template-columns: 1fr; } }
  .topic-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px;
  }
  .topic-name { font-size: 13px; font-weight: 700; margin-bottom: 10px; }
  .topic-bar-track { height: 6px; background: var(--border); border-radius: 4px; overflow: hidden; margin-bottom: 6px; }
  .topic-bar-fill { height: 100%; border-radius: 4px; transition: width 0.8s cubic-bezier(0.4,0,0.2,1); }
  .topic-pct { font-family: 'Space Mono', monospace; font-size: 12px; }

  .attempts-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 20px;
    padding: 28px; position: relative; overflow: hidden;
  }
  .attempts-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--accent4), var(--accent3));
  }
  .attempt-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 14px;
  }
  .attempt-row:last-child { border-bottom: none; }
  .attempt-date { color: var(--muted); font-family: 'Space Mono', monospace; font-size: 11px; }
  .attempt-topic { font-weight: 700; }
  .attempt-score {
    font-family: 'Space Mono', monospace; font-size: 13px; font-weight: 700;
    padding: 3px 10px; border-radius: 8px;
  }
  .score-high  { background: rgba(6,214,160,0.15);  color: var(--accent3); }
  .score-mid   { background: rgba(255,209,102,0.15); color: var(--accent2); }
  .score-low   { background: rgba(255,107,107,0.15); color: var(--accent1); }

  .loading { text-align: center; padding: 60px 0; color: var(--muted); font-family: 'Space Mono', monospace; font-size: 13px; }
  .dot-pulse::after { content: '...'; animation: dots 1.2s infinite; }
  @keyframes dots { 0%,100%{content:'.'} 33%{content:'..'} 66%{content:'...'} }
  .empty { text-align: center; padding: 48px 0; color: var(--muted); }
  .empty .big { font-size: 40px; margin-bottom: 12px; }
  .empty p { font-size: 14px; line-height: 1.7; }
</style>
</head>
<body>
<div class="container">
  <div class="top-bar">
    <a class="back-btn" href="index.html">← Back</a>
    <h1 class="page-title">Progress</h1>
  </div>

  <div id="app">
    <div class="loading"><span class="dot-pulse">Loading results</span></div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://jivcocultvmibdhnuncw.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_orpPb5Con2_VAdyH_EiQUw_S6SbtgrZ';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let allRows = [];
  let activeTopics = new Set(['All']);
  let scoreChart = null;

  const TOPIC_COLORS = {
    'Multiplication & Division':  '#ff6b6b',
    'Fractions — Understanding':  '#ffd166',
    'Decimals — Understanding':   '#06d6a0',
    'Place Value':                '#c77dff',
    'Factors & Multiples':        '#ff9f43',
    'Area & Perimeter':           '#74b9ff',
    'Fraction Operations':        '#ff6b6b',
    'Decimal Operations':         '#ffd166',
    'Volume':                     '#06d6a0',
    'Coordinate Plane':           '#c77dff',
  };

  function topicColor(t) { return TOPIC_COLORS[t] || '#a7a5c3'; }

  async function load() {
    const { data, error } = await supabaseClient
      .from('quiz_results')
      .select('*')
      .eq('student', 'tara')
      .order('created_at', { ascending: true });

    const app = document.getElementById('app');

    if (error) {
      app.innerHTML = `<div class="empty"><div class="big">⚠️</div><p>Could not load results.<br><small style="opacity:.6">${error.message}</small></p></div>`;
      return;
    }

    if (!data || data.length === 0) {
      app.innerHTML = `<div class="empty"><div class="big">📭</div><p>No results yet.<br>Complete a quiz to see your progress here!</p></div>`;
      return;
    }

    allRows = data;
    render();
  }

  function filteredRows() {
    if (activeTopics.has('All')) return allRows;
    return allRows.filter(r => activeTopics.has(r.topic));
  }

  function render() {
    const rows = filteredRows();
    const topics = ['All', ...new Set(allRows.map(r => r.topic))];

    const sessions = {};
    allRows.forEach(r => {
      if (!sessions[r.session_id]) {
        sessions[r.session_id] = { score: r.total_score, total: r.total_quiz_questions, date: r.created_at };
      }
    });
    const sessionList = Object.values(sessions).sort((a, b) => new Date(a.date) - new Date(b.date));

    const totalAttempts = sessionList.length;
    const maxScore = totalAttempts ? Math.max(...sessionList.map(r => r.total)) : 15;
    const avgScore = totalAttempts ? Math.round(sessionList.reduce((s, r) => s + r.score, 0) / totalAttempts * 10) / 10 : 0;
    const bestScore = totalAttempts ? Math.max(...sessionList.map(r => r.score)) : 0;

    const topicMap = {};
    rows.forEach(r => {
      if (!topicMap[r.topic]) topicMap[r.topic] = { correct: 0, total: 0 };
      topicMap[r.topic].correct += r.correct_answers;
      topicMap[r.topic].total   += r.total_questions;
    });

    document.getElementById('app').innerHTML = `
      <div class="stats-grid">
        <div class="stat-card c1">
          <div class="stat-label">Total Attempts</div>
          <div class="stat-value c1">${totalAttempts}</div>
          <div class="stat-sub">quizzes completed</div>
        </div>
        <div class="stat-card c2">
          <div class="stat-label">Average Score</div>
          <div class="stat-value c2">${avgScore}<span style="font-size:16px;color:var(--muted)">/${maxScore}</span></div>
          <div class="stat-sub">${Math.round(avgScore / maxScore * 100)}% accuracy</div>
        </div>
        <div class="stat-card c3">
          <div class="stat-label">Best Score</div>
          <div class="stat-value c3">${bestScore}<span style="font-size:16px;color:var(--muted)">/${maxScore}</span></div>
          <div class="stat-sub">personal best</div>
        </div>
      </div>

      <div class="filter-wrap">
        <div class="section-label">Filter by Topic</div>
        <div class="chips" id="chip-row">
          ${topics.map(t => `<button class="chip ${activeTopics.has(t) ? 'active' : ''}" data-topic="${t}">${t}</button>`).join('')}
        </div>
      </div>

      <div class="chart-card">
        <div class="chart-title">Score Over Time</div>
        <div class="chart-wrap"><canvas id="scoreChart"></canvas></div>
      </div>

      ${Object.keys(topicMap).length > 0 ? `
      <div class="section-label" style="margin-bottom:12px">Performance by Topic</div>
      <div class="topic-grid" id="topic-grid">
        ${Object.entries(topicMap).map(([topic, {correct, total}]) => {
          const pct = Math.round((correct / total) * 100);
          const col = topicColor(topic);
          const cls = pct >= 80 ? 'score-high' : pct >= 50 ? 'score-mid' : 'score-low';
          return `
            <div class="topic-card">
              <div class="topic-name" style="color:${col}">${topic}</div>
              <div class="topic-bar-track">
                <div class="topic-bar-fill" style="width:${pct}%;background:${col}"></div>
              </div>
              <div class="topic-pct ${cls}" style="display:inline-block">${pct}% &nbsp;(${correct}/${total})</div>
            </div>`;
        }).join('')}
      </div>` : ''}

      <div class="attempts-card">
        <div class="chart-title">Recent Attempts</div>
        <div id="attempts-list">
          ${rows.length === 0
            ? `<div class="empty" style="padding:24px 0"><p>No results match this filter.</p></div>`
            : [...rows].reverse().slice(0, 20).map(r => {
                const pct = r.percentage;
                const cls = pct >= 80 ? 'score-high' : pct >= 50 ? 'score-mid' : 'score-low';
                const date = r.created_at ? new Date(r.created_at).toLocaleDateString('en-US', {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'}) : '—';
                return `
                  <div class="attempt-row">
                    <div>
                      <div class="attempt-topic" style="color:${topicColor(r.topic)}">${r.topic}</div>
                      <div class="attempt-date">${date}</div>
                    </div>
                    <div class="attempt-score ${cls}">${r.correct_answers}/${r.total_questions} &nbsp; ${pct}%</div>
                  </div>`;
              }).join('')
          }
        </div>
      </div>
    `;

    document.getElementById('chip-row').addEventListener('click', e => {
      const btn = e.target.closest('.chip');
      if (!btn) return;
      const topic = btn.dataset.topic;
      if (topic === 'All') {
        activeTopics = new Set(['All']);
      } else {
        activeTopics.delete('All');
        if (activeTopics.has(topic)) activeTopics.delete(topic);
        else activeTopics.add(topic);
        if (activeTopics.size === 0) activeTopics.add('All');
      }
      render();
    });

    const labels = sessionList.map((r, i) => `#${i + 1}`);
    const scores = sessionList.map(r => r.score);
    const ctx = document.getElementById('scoreChart').getContext('2d');
    if (scoreChart) scoreChart.destroy();
    scoreChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels,
        datasets: [{
          data: scores,
          borderColor: '#c77dff',
          backgroundColor: 'rgba(199,125,255,0.08)',
          borderWidth: 2.5,
          pointBackgroundColor: scores.map(s => s >= maxScore * 0.8 ? '#06d6a0' : s >= maxScore * 0.53 ? '#ffd166' : '#ff6b6b'),
          pointBorderColor: 'transparent',
          pointRadius: 5,
          tension: 0.35,
          fill: true,
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: {
          backgroundColor: '#1a1927', borderColor: '#2e2c45', borderWidth: 1,
          titleColor: '#a7a5c3', bodyColor: '#fffffe',
          callbacks: { label: ctx => ` Score: ${ctx.parsed.y} / ${maxScore}` }
        }},
        scales: {
          x: { grid: { color: '#2e2c45' }, ticks: { color: '#a7a5c3', font: { family: 'Space Mono', size: 11 } } },
          y: { min: 0, max: maxScore, grid: { color: '#2e2c45' }, ticks: { color: '#a7a5c3', font: { family: 'Space Mono', size: 11 }, stepSize: Math.ceil(maxScore / 5) } }
        }
      }
    });
  }

  load();
</script>
</body>
</html>
