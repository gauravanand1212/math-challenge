<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Math Challenge</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Nunito', sans-serif;
      background: #0f0e17;
      color: #fffffe;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .container { text-align: center; max-width: 480px; width: 100%; }
    h1 {
      font-size: clamp(32px, 8vw, 52px);
      font-weight: 900;
      background: linear-gradient(135deg, #ffd166, #06d6a0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
    }
    p {
      color: #a7a5c3;
      font-size: 15px;
      margin-bottom: 48px;
    }
    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 400px) { .cards { grid-template-columns: 1fr; } }
    .card {
      background: #1a1927;
      border: 1px solid #2e2c45;
      border-radius: 20px;
      padding: 32px 20px;
      text-decoration: none;
      color: inherit;
      transition: transform 0.15s, border-color 0.15s;
      display: block;
    }
    .card:hover { transform: translateY(-3px); }
    .card.gia  { border-top: 3px solid #74b9ff; }
    .card.tara { border-top: 3px solid #c77dff; }
    .card:hover.gia  { border-color: #74b9ff; }
    .card:hover.tara { border-color: #c77dff; }
    .card-name {
      font-size: 22px;
      font-weight: 900;
      margin-bottom: 6px;
    }
    .gia  .card-name { color: #74b9ff; }
    .tara .card-name { color: #c77dff; }
    .card-grade {
      font-size: 12px;
      color: #a7a5c3;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Math Challenge</h1>
    <p>Daily quizzes, adaptive difficulty.</p>
    <div class="cards">
      <a class="card gia" href="gia/">
        <div class="card-name">Gia</div>
        <div class="card-grade">7th – 8th grade</div>
      </a>
      <a class="card tara" href="tara/">
        <div class="card-name">Tara</div>
        <div class="card-grade">4th – 5th grade</div>
      </a>
    </div>
  </div>
</body>
</html>
