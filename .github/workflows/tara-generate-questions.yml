name: Generate Daily Questions — Tara

on:
  schedule:
    - cron: '0 3-23 * * *'  # Every hour 3 AM–11 PM UTC; skips automatically once questions exist
  workflow_dispatch:        # allow manual run from GitHub Actions tab

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install @google/generative-ai @supabase/supabase-js

      - name: Run adaptive coach (assess performance & set difficulty)
        run: node scripts/adaptive-coach.js
        env:
          STUDENT: tara
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Generate and save questions
        run: node scripts/generate-questions.js
        env:
          STUDENT: tara
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
