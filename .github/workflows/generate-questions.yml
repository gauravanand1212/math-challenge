name: Generate Daily Questions

on:
  schedule:
    - cron: '0 3 * * *'   # 3:00 AM UTC every day
  workflow_dispatch:        # allow manual run from GitHub Actions tab
    inputs:
      force:
        description: 'Set to 1 to delete and regenerate existing questions for today'
        required: false
        default: ''

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install @google/generative-ai @supabase/supabase-js

      - name: Run adaptive coach (assess performance & set difficulty)
        run: node scripts/adaptive-coach.js
        env:
          STUDENT: gia
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Generate and save questions
        run: node scripts/generate-questions.js
        env:
          STUDENT: gia
          FORCE: ${{ github.event.inputs.force }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
