name: Generate Daily Questions

on:
  schedule:
    - cron: '0 3 * * *'   # 3:00 AM UTC every day
  workflow_dispatch:        # allow manual run from GitHub Actions tab

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install @anthropic-ai/sdk @supabase/supabase-js

      - name: Generate and save questions
        run: node scripts/generate-questions.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
